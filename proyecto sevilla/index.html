<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuestos PRO | App</title>

    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="style.css">
    <!-- Librería para crear PDFs nativos en el celular -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body class="text-light py-4 py-md-5">

    <!-- FONDO INMERSIVO (Modo Oscuro) -->
    <div class="bg-shapes hide-on-print">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container-xxl position-relative" style="z-index: 2;">
        <div class="row g-4">

            <!-- PANEL IZQUIERDO: FORMULARIO -->
            <div class="col-lg-7 hide-on-print">

                <!-- CONFIGURACIÓN DE EMPRESA -->
                <div class="bg-white text-dark p-4 rounded shadow-sm border mb-4 panel-hover"
                    style="background: rgba(255, 255, 255, 0.95) !important; backdrop-filter: blur(10px);">
                    <h6 class="text-muted text-uppercase fw-bold mb-3" style="font-size: 0.75rem; letter-spacing: 1px;">
                        Configuración de tu Empresa</h6>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <input type="text" id="myCompanyName" class="form-control bg-light border-0 py-2 rounded"
                                placeholder="Nombre de tu Marca / Empresa" oninput="saveCompanyInfo()">
                        </div>
                        <div class="col-md-6">
                            <input type="text" id="myCompanyContact" class="form-control bg-light border-0 py-2 rounded"
                                placeholder="Teléfono o Email" oninput="saveCompanyInfo()">
                        </div>
                    </div>
                </div>

                <!-- NUEVO PRESUPUESTO -->
                <div class="bg-white text-dark p-4 p-md-5 rounded shadow-sm border panel-hover"
                    style="background: rgba(255, 255, 255, 0.95) !important; backdrop-filter: blur(10px);">
                    <h3 class="fw-bold border-bottom pb-3 mb-4">Nuevo Presupuesto</h3>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label text-muted text-uppercase fw-bold"
                                style="font-size: 0.75rem;">Cliente / Proyecto</label>
                            <input type="text" id="clientName"
                                class="form-control form-control-lg bg-light border-0 rounded"
                                placeholder="Ej. Familia López">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-muted text-uppercase fw-bold" style="font-size: 0.75rem;">Nº
                                Ref</label>
                            <input type="text" id="quoteRef"
                                class="form-control form-control-lg bg-light border-0 rounded" placeholder="Ej. 001">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-muted text-uppercase fw-bold"
                                style="font-size: 0.75rem;">Moneda</label>
                            <select id="currency"
                                class="form-select form-select-lg bg-light border-0 fw-bold text-dark rounded"
                                onchange="changeCurrency()">
                                <option value="ARS">Pesos (ARS)</option>
                                <option value="USD">Dólares (US$)</option>
                            </select>
                        </div>
                    </div>

                    <!-- ÍTEMS -->
                    <div class="mb-4">
                        <label class="form-label text-muted text-uppercase fw-bold" style="font-size: 0.75rem;">Detalle
                            de Costos</label>
                        <div id="itemsContainer" class="d-flex flex-column gap-2 mb-3"></div>

                        <button onclick="addNewItem()"
                            class="btn btn-light border btn-sm fw-bold text-secondary px-3 py-2 btn-hover rounded">
                            + Agregar Fila
                        </button>
                    </div>

                    <!-- CONDICIONES -->
                    <div class="mb-4 mt-5">
                        <label class="form-label text-muted text-uppercase fw-bold"
                            style="font-size: 0.75rem;">Condiciones / Notas (Opcional)</label>
                        <textarea id="quoteNotes" class="form-control bg-light border-0 rounded" rows="2"
                            placeholder="Ej. Validez 15 días. Pago 50% adelantado."></textarea>
                    </div>

                    <!-- TOTALES -->
                    <div class="border-top pt-4">
                        <div class="w-100 ms-auto" style="max-width: 350px;">
                            <div class="d-flex justify-content-between text-secondary mb-2">
                                <span class="fw-medium">Subtotal:</span>
                                <span id="subtotal" class="fw-bold text-dark">0.00</span>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <div class="d-flex align-items-center gap-2">
                                    <input type="text" id="taxName" value="IVA"
                                        class="form-control form-control-sm text-center bg-light border-0 rounded"
                                        style="width: 70px;" oninput="calculateTotals()">
                                    <div class="input-group input-group-sm" style="width: 80px;">
                                        <input type="number" id="taxRate" value="0" min="0"
                                            class="form-control text-center bg-light border-0 rounded-start"
                                            oninput="calculateTotals()">
                                        <span class="input-group-text bg-light border-0 text-muted rounded-end">%</span>
                                    </div>
                                </div>
                                <span id="taxAmount" class="text-secondary fw-bold">0.00</span>
                            </div>

                            <div class="d-flex justify-content-between pt-3 mt-3 border-top">
                                <span class="fs-4 fw-black text-dark">Total:</span>
                                <span id="grandTotal" class="fs-4 fw-black text-dark">0.00</span>
                            </div>
                        </div>
                    </div>

                    <button onclick="saveQuote()"
                        class="btn btn-dark w-100 py-3 rounded fw-bold mt-5 shadow btn-hover fs-6 text-uppercase"
                        style="letter-spacing: 1px;">
                        Guardar Presupuesto
                    </button>
                </div>
            </div>

            <!-- PANEL DERECHO: HISTORIAL -->
            <div class="col-lg-5 position-sticky top-0 pt-lg-3" style="z-index: 1;">
                <div class="d-flex justify-content-between align-items-end mb-4 hide-on-print">
                    <h4 class="fw-bold mb-0 text-white">Documentos Guardados</h4>
                </div>

                <div id="savedQuotesList" class="d-flex flex-column gap-4 printable-area"></div>
            </div>
        </div>
    </div>

    <!-- TOAST (Notificaciones) -->
    <div id="toastContainer" class="position-fixed bottom-0 end-0 p-4 hide-on-print" style="z-index: 1100;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.css"></script>
    <script src="app.js"></script>
</body>

</html>
